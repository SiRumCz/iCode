# iCode CI on the GitHub mirror.
# Development primary is GitCode; this workflow validates the synced tree.
#
# openjiuwen SDK comes from [tool.uv.sources] (gitcode.com/michaelling/agent-core,
# branch icode), pinned in uv.lock. GitHub Actions rewrites the SSH git URL to
# public HTTPS so uv can fetch without a deploy key.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iCode
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Prefer HTTPS for GitCode git dependencies
        run: |
          git config --global url."https://gitcode.com/".insteadOf "ssh://git@gitcode.com/"
          git config --global url."https://gitcode.com/".insteadOf "git@gitcode.com:"

      - name: Sync
        run: uv sync --frozen

      - name: Smoke
        run: make smoke

      - name: Unit tests
        run: >
          make test TESTFLAGS="tests/cli/unit tests/unit_tests -q
          --ignore=tests/unit_tests/cli/test_auto_harness_cli.py
          --ignore=tests/unit_tests/cli/test_auto_harness_repl.py"
