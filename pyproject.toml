[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-icode"
version = "0.1.37"
description = "iCode — EventBus coding assistant (CLI / TUI / ACP) on the openjiuwen SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openjiuwen>=0.1.16",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "textual>=1.0.0",
    "textual-serve>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-html>=4.0",
    "pytest-mock>=3.14",
]

[project.scripts]
icode = "openjiuwen_icode.cli:cli"

[project.urls]
Homepage = "https://openjiuwen.com"
Documentation = "https://openjiuwen.com/docs-page"
Repository = "https://gitcode.com/michaelling/iCode.git"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# Team default: fork + icode branch (uv.lock pins the resolved commit).
#
# Local joint-debug workflow:
#   1. uv add --editable ../agent-core   # do not commit the path override
#   2. develop / test against the sibling checkout
#   3. push SDK changes to origin/icode
#   4. restore git source in this file if needed, then:
#        uv lock --upgrade-package openjiuwen
#      and commit the updated uv.lock for the team
openjiuwen = { git = "ssh://git@gitcode.com/michaelling/agent-core.git", branch = "icode" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-html>=4.0",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
include = ["openjiuwen_icode*"]

[tool.setuptools.package-data]
openjiuwen_icode = [
    "**/prompts/**/*.md",
    "**/locales/**/*.md",
    "vendor/rg/VERSION",
    "vendor/rg/README.md",
    "vendor/rg/*/rg",
    "vendor/rg/*/rg.exe",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "smoke: no-LLM CLI/TUI smoke (safe for default CI)",
    "llm: real LLM e2e; requires ICODE_E2E_API_KEY (see tests/cli/e2e/models.yaml)",
]

[tool.coverage.run]
# Omit interactive shells and the full Textual app entry; screens/widgets and
# helpers are covered by unit tests (Pilot). Click CLI is e2e-only.
parallel = true
source = ["openjiuwen_icode"]
omit = [
    "tests/*",
    "openjiuwen_icode/tui/app.py",
    "openjiuwen_icode/cli.py",
    "openjiuwen_icode/ui/repl.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
